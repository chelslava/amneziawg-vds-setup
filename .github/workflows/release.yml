name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
      - name: Test
        run: go test ./...
      - name: Verify immutable references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.go' --exclude='*_test.go' ':[[:space:]]*latest|uses:.*@v[0-9]' internal .github; then
            echo 'mutable production reference found' >&2
            exit 1
          fi
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in windows/amd64 linux/amd64 darwin/amd64 darwin/arm64; do
            IFS=/ read -r goos goarch <<< "$target"
            ext=""
            [[ "$goos" == windows ]] && ext=".exe"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/awg-vds-${goos}-${goarch}${ext}" ./cmd/awg-vds
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: awg-vds ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
