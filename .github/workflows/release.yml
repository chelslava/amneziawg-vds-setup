name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test
        run: go test ./...
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in windows/amd64 linux/amd64 darwin/amd64 darwin/arm64; do
            IFS=/ read -r goos goarch <<< "$target"
            ext=""
            [[ "$goos" == windows ]] && ext=".exe"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/awg-vds-${goos}-${goarch}${ext}" ./cmd/awg-vds
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          name: awg-vds ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
