name: e2e-disposable-vds

on:
  workflow_dispatch:
    inputs:
      run_upstream_probe:
        description: 'Run the explicit upstream doctor probe on the Debian target'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lifecycle:
    name: Legacy lifecycle (${{ matrix.distro }})
    runs-on: ubuntu-latest
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            host_secret: E2E_UBUNTU_HOST
          - distro: debian
            host_secret: E2E_DEBIAN_HOST
    env:
      E2E_HOST: ${{ secrets[matrix.host_secret] }}
      E2E_USER: ${{ secrets.E2E_SSH_USER }}
      E2E_PORT: ${{ secrets.E2E_SSH_PORT }}
      E2E_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
      E2E_KNOWN_HOSTS: ${{ secrets.E2E_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
      - name: Validate disposable-host secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$E2E_HOST"
          test -n "$E2E_USER"
          test -n "$E2E_KEY"
          test -n "$E2E_KNOWN_HOSTS"
      - name: Prepare pinned SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$E2E_KEY" > "$RUNNER_TEMP/e2e-id"
          printf '%s' "$E2E_KNOWN_HOSTS" > "$RUNNER_TEMP/e2e-known-hosts"
          chmod 600 "$RUNNER_TEMP/e2e-id" "$RUNNER_TEMP/e2e-known-hosts"
      - name: Build CLI
        run: go build -trimpath -o awg-vds ./cmd/awg-vds
      - name: Run Legacy lifecycle
        shell: bash
        run: |
          set -euo pipefail
          common=(--host "$E2E_HOST" --user "$E2E_USER" --ssh-port "${E2E_PORT:-22}" --identity-file "$RUNNER_TEMP/e2e-id" --known-hosts "$RUNNER_TEMP/e2e-known-hosts" --engine legacy)
          ./awg-vds doctor "${common[@]}"
          ./awg-vds install "${common[@]}"
          ./awg-vds install "${common[@]}"
          ./awg-vds status "${common[@]}"
          ./awg-vds backup "${common[@]}"
          ./awg-vds update "${common[@]}"
          printf 'Legacy lifecycle passed for %s (%s)\n' "$E2E_HOST" "${{ matrix.distro }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Probe upstream diagnostics
        if: matrix.distro == 'debian' && inputs.run_upstream_probe
        shell: bash
        run: |
          set -euo pipefail
          common=(--host "$E2E_HOST" --user "$E2E_USER" --ssh-port "${E2E_PORT:-22}" --identity-file "$RUNNER_TEMP/e2e-id" --known-hosts "$RUNNER_TEMP/e2e-known-hosts" --engine upstream)
          set +e
          output=$(./awg-vds doctor "${common[@]}" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output" | grep -Eq 'AMNEZIAWG=(unsupported|repository-unavailable|present|installable|module-loaded)'
          printf 'Upstream diagnostic probe passed (exit=%s)\n' "$code" >> "$GITHUB_STEP_SUMMARY"
      - name: Destroy disposable deployment and credentials
        if: always()
        shell: bash
        run: |
          set +e
          ssh -i "$RUNNER_TEMP/e2e-id" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/e2e-known-hosts" -p "${E2E_PORT:-22}" "$E2E_USER@$E2E_HOST" 'sudo docker rm -f awg-vds-legacy awg-vds-upstream >/dev/null 2>&1 || true; sudo rm -rf /opt/awg-vds'
